[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prizm"
version = "0.1.0"
description = "Trust-first conversational data analysis agent (SQL-first, transparent)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "litellm>=1.50",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "chainlit>=1.3",
    "matplotlib>=3.9",
    "rank-bm25>=0.2.2",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-litellm>=0.1",
]

[project.optional-dependencies]
# 可选：向量检索 + rerank（默认关闭，按评测结果再启用）
vector = ["sentence-transformers>=3.0"]
# 可选：读取老式 .xls（.xlsx 走 openpyxl，无需此项）
xl = ["xlrd>=2.0"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prizm"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002"]

[tool.ruff.lint.isort]
known-first-party = ["prizm"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -m 'not eval'"
markers = [
    "unit: fast, deterministic, no LLM/network",
    "integration: cross-module flows",
    "eval: statistical LLM evaluation, excluded from default runs",
]

[tool.coverage.run]
source = ["prizm"]
